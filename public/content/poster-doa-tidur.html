<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poster — Doa Sebelum Tidur</title>
  <meta name="description" content="Poster doa sebelum tidur untuk anak: ilustrasi malam, teks Arab, latin, dan arti dalam Bahasa Indonesia serta Inggris." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --night: #1e1b4b;
      --indigo: #4338ca;
      --soft: #c7d2fe;
      --gold: #fde68a;
      --cream: #f5f3ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(700px 500px at 85% -10%, #312e81aa, transparent 60%),
        linear-gradient(160deg, #151240 0%, #1e1b4b 60%, #312e81 100%);
    }

    .print-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      color: #1e1b4b;
      background: var(--gold);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
      cursor: pointer;
    }
    .print-btn:hover { background: #fcd34d; }

    .sheet {
      position: relative;
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15mm 14mm 12mm;
      background:
        radial-gradient(90mm 60mm at 88% 4%, rgba(99, 102, 241, 0.35), transparent 62%),
        radial-gradient(80mm 55mm at 6% 96%, rgba(79, 70, 229, 0.3), transparent 60%),
        linear-gradient(170deg, #1e1b4b 0%, #27245e 55%, #312e81 100%);
      border-radius: 8mm;
      box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: var(--gold);
    }

    .title {
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: 15mm;
      line-height: 1.1;
      color: var(--cream);
      letter-spacing: 0.02em;
      margin-top: 12mm;
      text-align: center;
    }

    .title small {
      display: block;
      font-family: "Nunito", sans-serif;
      font-size: 4.2mm;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 2mm;
    }

    .arabic-card {
      width: 100%;
      margin-top: 7mm;
      padding: 8mm 6mm;
      border-radius: 6mm;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(199, 210, 254, 0.25);
      box-shadow: 0 10mm 24mm -12mm rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .arabic-card .ar {
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: 13mm;
      line-height: 1.7;
      color: var(--gold);
      direction: rtl;
      text-shadow: 0 0 8mm rgba(253, 230, 138, 0.35);
    }

    .latin {
      margin-top: 5mm;
      font-size: 5.2mm;
      font-weight: 700;
      font-style: italic;
      color: var(--soft);
      text-align: center;
    }

    .scene {
      width: 84%;
      margin-top: 5mm;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene svg { width: 100%; height: auto; }

    .meaning {
      width: 100%;
      text-align: center;
      padding: 6mm 8mm;
      border-radius: 6mm;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px dashed rgba(199, 210, 254, 0.3);
    }

    .meaning .id {
      font-size: 5.4mm;
      font-weight: 800;
      color: var(--cream);
    }

    .meaning .en {
      margin-top: 1.5mm;
      font-size: 4.6mm;
      font-weight: 600;
      font-style: italic;
      color: var(--soft);
    }

    .footer {
      margin-top: 5mm;
      display: flex;
      align-items: center;
      gap: 4mm;
      color: var(--gold);
    }

    .footer .line { height: 1.2px; width: 22mm; background: linear-gradient(90deg, transparent, var(--gold)); }
    .footer .line:last-child { transform: scaleX(-1); }
    .footer span { font-size: 4mm; font-weight: 700; letter-spacing: 0.1em; }

    @media print {
      @page { size: A4 portrait; margin: 0; }

      body { padding: 0; background: #fff; }

      .print-btn { display: none; }

      .sheet {
        border-radius: 0;
        box-shadow: none;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

      </g>

        <circle cx="48" cy="16" r="1.8" />

        <circle cx="312" cy="8" r="1.8" />
        <circle cx="400" cy="18" r="1.8" />
        <circle cx="488" cy="8" r="1.8" />

        <circle cx="666" cy="8" r="1.8" />
        <circle cx="754" cy="18" r="1.8" />
      </g>
    </svg>

    <h1 class="title">
      Doa Sebelum Tidur
      <small>Doa Harian Anak Muslim</small>
    </h1>

    <section class="arabic-card">
      <p class="ar" lang="ar" dir="rtl">بِاسْمِكَ اللّٰهُمَّ أَحْيَا وَأَمُوتُ</p>
    </section>

    <p class="latin">Bismika Allahumma ahyaa wa amuut</p>

      <svg viewBox="0 0 400 400">
        <rect x="52" y="44" width="136" height="156" rx="12" fill="#1e1b4b" />
        <rect x="52" y="44" width="136" height="156" rx="12" fill="none" stroke="#92400e" stroke-width="9" />

        <path d="M290 264 Q296 268 302 264" fill="none" stroke="#3f2d20" stroke-width="3" stroke-linecap="round" />

        <path d="M236 308 Q262 294 282 306 Q304 318 324 308 Q344 298 364 308 L376 310 V382 Q308 396 236 382 Z" fill="#6366f1" />
        <path d="M236 308 Q262 294 282 306 Q304 318 324 308 Q344 298 364 308 L376 310 V316 L236 316 Z" fill="#4f46e5" />
        <path d="M258 316 v66 M290 316 v66 M322 316 v66" stroke="#4f46e5" stroke-width="3" opacity="0.55" />
        <path d="M236 382 Q308 396 376 382" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
      </svg>
    </figure>

    <section class="meaning">
      <p class="id">&ldquo;Dengan nama-Mu, ya Allah, aku hidup dan aku mati.&rdquo;</p>
      <p class="en">&ldquo;In Your name, O Allah, I live and I die.&rdquo;</p>
    </section>

    <footer class="footer">
      <span class="line"></span>
      <span>BACA SETIAP SEBELUM TIDUR</span>
      <span class="line"></span>
    </footer>
  </main>

  <button class="print-btn">Cetak Poster</button>
</body>
</html>
