<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bismillah — Halaman Pembuka</title>
  <meta name="description" content="Halaman fokus kaligrafi Bismillah: tenang, segar, dan menyejukkan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --cream: #fbfdf8;
      --mint-100: #dff3e7;
      --mint-200: #bfe8d2;
      --leaf-400: #4cae82;
      --leaf-500: #2f9e6e;
      --leaf-600: #23855b;
      --deep-700: #1d6b49;
      --deep-800: #14523a;
      --ink: #2b5242;
      --soft-ink: #3f6a57;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 48px);
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 82% -10%, var(--mint-100), transparent 62%),
        radial-gradient(1000px 700px at -8% 110%, #e7f6ec, transparent 58%),
        radial-gradient(700px 500px at 50% 120%, #d8efe2, transparent 60%),
        linear-gradient(160deg, var(--cream) 0%, #f2faf5 50%, #e9f6ef 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.55;
      z-index: 0;
    }

    .orb--one {
      width: 42vmax;
      height: 42vmax;
      top: -14vmax;
      right: -10vmax;
      background: radial-gradient(circle at 35% 35%, var(--mint-200), #8fd4b1 55%, transparent 72%);
      animation: drift-one 20s ease-in-out infinite alternate;
    }

    @keyframes drift-one {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-6vmax, 5vmax, 0) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: min(96vw, 1200px);
      container-type: inline-size;
      text-align: center;
      padding-block: clamp(2.75rem, 8vw, 5.5rem);
      padding-inline: clamp(1rem, 7cqi, 4rem);
      border-radius: 32px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.44));
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 24px 70px -30px rgba(20, 82, 58, 0.35),
        0 8px 24px -12px rgba(20, 82, 58, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: rise 1.4s cubic-bezier(0.22, 0.9, 0.34, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background: radial-gradient(62% 55% at 50% 36%, rgba(143, 212, 177, 0.24), transparent 70%);
      pointer-events: none;
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    .arabic {
      display: block;
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 9.4cqi, 8rem);
      line-height: 1.5;
      letter-spacing: 0.01em;
      white-space: nowrap;
      color: var(--deep-800);
      animation:
        float 7s ease-in-out infinite,
        glow 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 2px 18px rgba(47, 158, 110, 0.1); }
      50% { text-shadow: 0 2px 32px rgba(47, 158, 110, 0.4), 0 0 6px rgba(47, 158, 110, 0.18); }
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: min(420px, 80%);
      margin: clamp(1.25rem, 3vw, 2.25rem) auto clamp(1.1rem, 2.5vw, 1.75rem);
    }

    .divider__line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45, 139, 100, 0.35), transparent);
    }

    .divider__diamond {
      width: 9px;
      height: 9px;
      border-radius: 2px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--leaf-500), var(--deep-700));
      box-shadow: 0 0 12px rgba(47, 158, 110, 0.45);
    }

    .translation {
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      font-weight: 600;
      font-style: italic;
      color: var(--deep-700);
    }

    .translation--id {
      margin-top: 0.45rem;
      font-style: normal;
      font-weight: 400;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      color: var(--soft-ink);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-height: 620px) {
      body {
        padding-block: 12px;
      }

      .card {
        padding-block: 1.5rem;
      }

      .arabic {
        font-size: clamp(1.1rem, 8cqi, 5rem);
      }

      .divider {
        margin-block: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  
    @media print {
      body { padding: 0; background: #fff !important; }
      @page { size: A4 portrait; margin: 14mm; }
      *, *::before, *::after { animation: none !important; transition: none !important; box-shadow: none !important; }
    }
</style>
</head>
<body>
  <div class="orb orb--one" aria-hidden="true"></div>

  <main class="card">
    <h1 class="arabic" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h1>

    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <span class="divider__diamond"></span>
      <span class="divider__line"></span>
    </div>

    <p class="translation">In the name of Allah, the Most Gracious, the Most Merciful</p>
    <p class="translation translation--id">Dengan nama Allah Yang Maha Pengasih, lagi Maha Penyayang</p>
  </main>
</body>
</html>
