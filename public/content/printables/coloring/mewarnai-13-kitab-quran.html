<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mewarnai Kitab Al-Qur'an — TPQ Qur'ani</title>
  <meta name="description" content="Mewarnai Kitab Al-Qur'an — lembar cetak A4, TPQ Qur'ani." />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: #334155;
      background: #f2f7f4;
    }
    .sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      display: flex;
      flex-direction: column;
      padding: 12mm 14mm;
      background: linear-gradient(165deg, #ffffff 0%, #fdfefb 60%, #ccfbf166 100%);
      overflow: hidden;
    }
    .head { display: flex; align-items: center; gap: 8px; }
    .head .brand {
      font-family: "Baloo 2", cursive; font-weight: 800; color: #134e4a;
      font-size: 11pt; letter-spacing: 0.02em;
    }
    .head .chip {
      margin-left: auto; font-size: 8.5pt; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: #134e4a; background: #ccfbf1;
      padding: 4px 12px; border-radius: 999px;
    }
    .title {
      font-family: "Baloo 2", cursive; font-weight: 800; text-align: center;
      font-size: 21pt; line-height: 1.15; color: #134e4a; margin-top: 6mm;
    }
    .subtitle {
      text-align: center; font-size: 10pt; font-weight: 700; font-style: italic;
      color: #64748b; margin-top: 2mm;
    }
    .art { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; margin: 6mm 0; }
    .art svg { width: 100%; height: auto; max-height: 190mm; }
    .foot {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 8.5pt; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: #134e4a;
    }
    .foot .l { height: 1.2px; width: 24mm; background: linear-gradient(90deg, transparent, #134e4a88); }
    .foot .l:last-child { transform: scaleX(-1); }
    .ar { font-family: "Amiri", serif; direction: rtl; }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { padding: 0; background: #fff; }
      .sheet { min-height: auto; height: 297mm; box-shadow: none; background: #fff !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="head">
      <span class="brand">TPQ Qur&rsquo;ani</span>
      <span class="chip">Mewarnai</span>
    </header>
    <h1 class="title">Mewarnai Kitab Al-Qur'an</h1>
    <p class="subtitle">Coloring · The Qur'an</p>
    <div class="art"><svg viewBox="0 0 400 380" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M60 140 Q 120 116 200 128 L 200 296 Q 120 284 60 308 Z"/><path d="M340 140 Q 280 116 200 128 L 200 296 Q 280 284 340 308 Z"/><path d="M200 128 L 200 296"/><rect x="96" y="176" width="84" height="10" rx="5"/><rect x="96" y="200" width="70" height="10" rx="5"/><rect x="96" y="224" width="78" height="10" rx="5"/><rect x="220" y="176" width="84" height="10" rx="5"/><rect x="220" y="200" width="70" height="10" rx="5"/><rect x="220" y="224" width="78" height="10" rx="5"/><path d="M140 330 L 140 356 L 200 346 L 260 356 L 260 330"/><path d="M180 330 L 200 356 L 220 330"/></svg></div>
    <footer class="foot">
      <span class="l"></span><span>Mewarnai &middot; TPQ Qur&rsquo;ani</span><span class="l"></span>
    </footer>
  </main>
</body>
</html>
