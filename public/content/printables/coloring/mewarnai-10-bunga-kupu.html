<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mewarnai Bunga &amp; Kupu-kupu — TPQ Qur'ani</title>
  <meta name="description" content="Mewarnai Bunga &amp; Kupu-kupu — lembar cetak A4, TPQ Qur'ani." />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: #334155;
      background: #f2f7f4;
    }
    .sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      display: flex;
      flex-direction: column;
      padding: 12mm 14mm;
      background: linear-gradient(165deg, #ffffff 0%, #fdfefb 60%, #ffe4e666 100%);
      overflow: hidden;
    }
    .head { display: flex; align-items: center; gap: 8px; }
    .head .brand {
      font-family: "Baloo 2", cursive; font-weight: 800; color: #881337;
      font-size: 11pt; letter-spacing: 0.02em;
    }
    .head .chip {
      margin-left: auto; font-size: 8.5pt; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: #881337; background: #ffe4e6;
      padding: 4px 12px; border-radius: 999px;
    }
    .title {
      font-family: "Baloo 2", cursive; font-weight: 800; text-align: center;
      font-size: 21pt; line-height: 1.15; color: #881337; margin-top: 6mm;
    }
    .subtitle {
      text-align: center; font-size: 10pt; font-weight: 700; font-style: italic;
      color: #64748b; margin-top: 2mm;
    }
    .art { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; margin: 6mm 0; }
    .art svg { width: 100%; height: auto; max-height: 190mm; }
    .foot {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 8.5pt; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: #881337;
    }
    .foot .l { height: 1.2px; width: 24mm; background: linear-gradient(90deg, transparent, #88133788); }
    .foot .l:last-child { transform: scaleX(-1); }
    .ar { font-family: "Amiri", serif; direction: rtl; }
    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { padding: 0; background: #fff; }
      .sheet { min-height: auto; height: 297mm; box-shadow: none; background: #fff !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="head">
      <span class="brand">TPQ Qur&rsquo;ani</span>
      <span class="chip">Mewarnai</span>
    </header>
    <h1 class="title">Mewarnai Bunga &amp; Kupu-kupu</h1>
    <p class="subtitle">Coloring · Flower &amp; Butterfly</p>
    <div class="art"><svg viewBox="0 0 400 380" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="150" cy="180" r="46"/><circle cx="108" cy="168" r="24"/><circle cx="108" cy="196" r="24"/><circle cx="192" cy="168" r="24"/><circle cx="192" cy="196" r="24"/><circle cx="150" cy="138" r="24"/><circle cx="150" cy="222" r="24"/><circle cx="150" cy="180" r="12"/><path d="M60 320 L 240 320 M 60 344 L 240 344"/><g transform="translate(292 170)"><ellipse cx="-26" cy="-22" rx="26" ry="34" transform="rotate(-25 -26 -22)"/><ellipse cx="26" cy="-22" rx="26" ry="34" transform="rotate(25 26 -22)"/><ellipse cx="-20" cy="30" rx="18" ry="24" transform="rotate(18 -20 30)"/><ellipse cx="20" cy="30" rx="18" ry="24" transform="rotate(-18 20 30)"/><rect x="-3" y="-8" width="6" height="34" rx="3"/><circle cx="0" cy="-14" r="5"/></g></svg></div>
    <footer class="foot">
      <span class="l"></span><span>Mewarnai &middot; TPQ Qur&rsquo;ani</span><span class="l"></span>
    </footer>
  </main>
</body>
</html>
